[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # Pre-existing transitive dependency advisories — tracked for upgrade separately
    "RUSTSEC-2023-0071",  # rsa: Marvin attack (transitive via rustls)
    "RUSTSEC-2026-0049",  # rustls-webpki (transitive via reqwest)
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
